<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Login | MREECO Electronics</title>
	<link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
	<header class="login-header">
		<a class="brand brand--login" href="index.html" aria-label="MREECO home">
			<img src="images/logo.png" alt="MREECO Electronics logo">
		</a>
	</header>
	<main class="login-main">
		<section class="login-panel" aria-labelledby="login-heading">
			<h1 id="login-heading">Sign in</h1>
			<p class="login-subtitle">Sign in or create an account</p>
			<button class="shop-login-button" type="button">Continue with shop</button>
			<div class="login-divider" aria-hidden="true"><span>or</span></div>
			<form class="login-form" data-login-form>
				<label class="sr-only" for="login-email">Email</label>
				<div class="login-email-field"><input id="login-email" name="email" type="email" placeholder="Email" autocomplete="email" required><button type="submit" aria-label="Continue with email">→</button></div>
				<label class="login-consent"><input type="checkbox" checked><span>Email me with news and offers</span></label>
				<p class="login-message" data-login-message aria-live="polite"></p>
			</form>
		</section>
	</main>
	<footer class="login-footer"><a href="#">Privacy policy</a></footer>
	<script src="js/script.js?v=20260822-6"></script>
</body>
</html>
